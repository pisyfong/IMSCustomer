# Kept deliberately small: this machine repeatedly hits the Windows COMMIT
# limit (system-managed pagefile grows lazily), and the daemon fails to
# start with 'paging file is too small' while RAM is still free.
# -XX:-UseG1GC avoids G1 reserving a large contiguous virtual region.
org.gradle.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
org.gradle.daemon=true
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
