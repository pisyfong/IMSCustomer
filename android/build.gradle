allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Ensure all modules use a consistent Kotlin stdlib version to avoid duplicate classes
subprojects { project ->
    // Workaround for isar_flutter_libs missing namespace in AGP 8+
    if (project.name == "isar_flutter_libs") {
        project.afterEvaluate {
            project.android {
                namespace = "dev.isar.isar_flutter_libs"
            }
        }
    }

    configurations.all { config ->
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.9.0'
                details.because 'Align Kotlin stdlib to 1.9.0 across all dependencies'
            }
        }
        resolutionStrategy.force(
                'org.jetbrains.kotlin:kotlin-stdlib:1.9.0',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
        )
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
